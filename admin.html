<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم المباشرة - معرض ADVOX</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; margin: 20px; background: #f3f4f6; color: #1f2937; line-height: 1.6; }
    h1, h2 { color: #111827; margin-bottom: 15px; text-align: center; }
    .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
    input, select, textarea { width: 100%; padding: 12px; margin: 10px 0 20px 0; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; transition: 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #16a34a; ring: 2px rgba(22, 163, 74, 0.2); outline: none; }
    
    button { background: #16a34a; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.2s; display: inline-block;}
    button:hover { background: #15803d; }
    .btn-danger { background: #dc2626; margin-right: 10px;} .btn-danger:hover { background: #b91c1c; }
    .btn-warning { background: #d97706; margin-right: 10px;} .btn-warning:hover { background: #b45309; }
    
    .btn-sync { background: #2563eb; font-size: 1.2rem; padding: 18px 30px; width: 100%; margin-top: 15px; display: block; text-align: center; }
    .btn-sync:hover { background: #1d4ed8; }

    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #edf2f7; }
    .item-row:last-child { border-bottom: none; }
    .actions { display: flex; gap: 5px; }
    .status { padding: 15px; background: #e0f2fe; color: #0369a1; border-radius: 8px; margin-bottom: 20px; display: none; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h1>⚙️ لوحة التحكم التلقائية (تعديل وحفظ مباشر)</h1>
  
  <div class="box">
    <h2>1. إعداد الربط الفوري</h2>
    <label>رمز الاتصال الخاص بك (GitHub Personal Access Token):</label>
    <input type="password" id="gh-token" placeholder="الصق الرمز الخاص بك هنا للحفظ المباشر">
    <button onclick="saveToken()" style="background:#4b5563;">حفظ الرمز في المتصفح</button>
  </div>

  <div id="status-msg" class="status"></div>

  <div class="grid">
    <!-- إدارة الأقسام -->
    <div>
      <div class="box">
        <h2 id="cat-form-title">إضافة / تعديل قسم</h2>
        <input type="hidden" id="edit-cat-id">
        <label>اسم القسم:</label>
        <input type="text" id="cat-name" placeholder="مثال: قواعد وشاشات TV">
        <button onclick="saveCategory()">حفظ القسم</button>
      </div>

      <div class="box">
        <h2>قائمة الأقسام الحالية</h2>
        <div id="categories-list"></div>
      </div>
    </div>

    <!-- إدارة المنتجات والأسعار -->
    <div>
      <div class="box">
        <h2 id="prod-form-title">إضافة / تعديل منتج</h2>
        <input type="hidden" id="edit-prod-id">
        
        <label>اختر القسم التابع له:</label>
        <select id="prod-cat-select"></select>

        <label>اسم المنتج:</label>
        <input type="text" id="prod-title" placeholder="اسم المنتج">

        <label>السعر (بالدينار العراقي):</label>
        <input type="text" id="prod-price" placeholder="مثال: 95,000">

        <label>المواصفات والقياسات (بالسنتيمتر):</label>
        <input type="text" id="prod-specs" placeholder="القياسات بالسنتيمتر أو البوصة">

        <label>الوصف التفصيلي:</label>
        <textarea id="prod-desc" rows="3"></textarea>

        <label>رابط صورة المنتج (URL):</label>
        <input type="text" id="prod-img" placeholder="https://example.com/image.jpg">

        <button onclick="saveProduct()">حفظ المنتج والتعديلات</button>
      </div>

      <div class="box">
        <h2>المنتجات والأسعار</h2>
        <div id="products-list"></div>
      </div>
    </div>
  </div>

  <button class="btn-sync" onclick="syncToGitHub()">💾 حفظ ونشر جميع التغييرات في المتجر فوراً</button>

  <script>
    // إعدادات المستودع (تأكد أنك تستخدم بياناتك الصحيحة)
    const USERNAME = "ameralahlam444-glitch";
    const REPO = "advox-store";
    const FILE_PATH = "data.json";

    let storeData = { categories: [], products: [] };
    let fileSHA = ""; // ضروري جداً لتحديث الملف عبر API

    function showStatus(msg) {
      const el = document.getElementById('status-msg');
      el.style.display = 'block';
      el.innerText = msg;
    }

    // حفظ الرمز في المتصفح وجلب البيانات الأصلية
    function saveToken() {
      const token = document.getElementById('gh-token').value;
      if (!token) return alert("يرجى لصق الرمز أولاً");
      localStorage.setItem('gh_token', token);
      showStatus("✅ تم حفظ الرمز بنجاح! جاري جلب بيانات المتجر...");
      loadFromGitHub();
    }

    // جلب ملف data.json من GitHub
    async function loadFromGitHub() {
      const token = localStorage.getItem('gh_token');
      if (token) document.getElementById('gh-token').value = token;
      
      try {
        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FILE_PATH}`, {
          headers: token ? { "Authorization": `token ${token}` } : {}
        });
        if (!res.ok) throw new Error();
        const json = await res.json();
        fileSHA = json.sha; // حفظ الـ SHA للتحديث لاحقاً
        const decodedContent = decodeURIComponent(escape(atob(json.content)));
        storeData = JSON.parse(decodedContent);
        renderAll();
        showStatus("✅ تم تحميل بيانات المتجر بنجاح.");
      } catch (e) {
        showStatus("⚠️ لم يتم العثور على رمز اتصال أو حدث خطأ في الشبكة. يرجى إدخال الرمز لتفعيل الحفظ المباشر.");
      }
    }

    function renderAll() {
      renderCategoriesList();
      renderCategorySelect();
      renderProductsList();
    }

    /* --- إدارة الأقسام --- */
    function renderCategoriesList() {
      document.getElementById('categories-list').innerHTML = storeData.categories.map(c => `
        <div class="item-row">
          <span><strong>${c.name}</strong></span>
          <div class="actions">
            <button onclick="editCategory('${c.id}')" class="btn-warning">تعديل</button>
            <button onclick="deleteCategory('${c.id}')" class="btn-danger">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function renderCategorySelect() {
      document.getElementById('prod-cat-select').innerHTML = storeData.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    function saveCategory() {
      const name = document.getElementById('cat-name').value;
      const id = document.getElementById('edit-cat-id').value;
      if (!name) return alert("أدخل اسم القسم");

      if (id) {
        const cat = storeData.categories.find(c => c.id === id);
        if (cat) cat.name = name;
      } else {
        storeData.categories.push({ id: 'cat_' + Date.now(), name });
      }
      resetCatForm();
      renderAll();
    }

    function editCategory(id) {
      const cat = storeData.categories.find(c => c.id === id);
      if (cat) {
        document.getElementById('cat-name').value = cat.name;
        document.getElementById('edit-cat-id').value = cat.id;
        document.getElementById('cat-form-title').innerText = "تعديل القسم";
      }
    }

    function deleteCategory(id) {
      if (confirm("هل أنت متأكد من حذف هذا القسم؟ سيتم حذف المنتجات التابعة له أيضاً.")) {
        storeData.categories = storeData.categories.filter(c => c.id !== id);
        storeData.products = storeData.products.filter(p => p.catId !== id);
        renderAll();
      }
    }

    function resetCatForm() {
      document.getElementById('cat-name').value = '';
      document.getElementById('edit-cat-id').value = '';
      document.getElementById('cat-form-title').innerText = "إضافة / تعديل قسم";
    }

    /* --- إدارة المنتجات --- */
    function renderProductsList() {
      document.getElementById('products-list').innerHTML = storeData.products.map(p => {
        const cat = storeData.categories.find(c => c.id === p.catId);
        return `
          <div class="item-row">
            <div>
              <strong>${p.title}</strong> — <span style="color:#16a34a; font-weight:bold;">${p.price} د.ع</span><br>
              <small style="color:#6b7280">القسم: ${cat ? cat.name : 'بدون قسم'} | القياسات: ${p.specs || 'غير محددة'}</small>
            </div>
            <div class="actions">
              <button onclick="editProduct('${p.id}')" class="btn-warning">تعديل</button>
              <button onclick="deleteProduct('${p.id}')" class="btn-danger">حذف</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function saveProduct() {
      const id = document.getElementById('edit-prod-id').value;
      const catId = document.getElementById('prod-cat-select').value;
      const title = document.getElementById('prod-title').value;
      const price = document.getElementById('prod-price').value;
      const specs = document.getElementById('prod-specs').value;
      const desc = document.getElementById('prod-desc').value;
      const img = document.getElementById('prod-img').value;

      if (!title || !price || !catId) return alert("يرجى ملء الاسم والسعر على الأقل، واختيار القسم");

      const prodData = { id: id || 'prod_' + Date.now(), catId, title, price, specs, desc, img };

      if (id) {
        const index = storeData.products.findIndex(p => p.id === id);
        if (index !== -1) storeData.products[index] = prodData;
      } else {
        storeData.products.push(prodData);
      }
      resetProdForm();
      renderAll();
    }

    function editProduct(id) {
      const p = storeData.products.find(p => p.id === id);
      if (!p) return;
      document.getElementById('edit-prod-id').value = p.id;
      document.getElementById('prod-cat-select').value = p.catId;
      document.getElementById('prod-title').value = p.title;
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-specs').value = p.specs || '';
      document.getElementById('prod-desc').value = p.desc || '';
      document.getElementById('prod-img').value = p.img || '';
      document.getElementById('prod-form-title').innerText = "تعديل المنتج";
    }

    function deleteProduct(id) {
      if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
        storeData.products = storeData.products.filter(p => p.id !== id);
        renderAll();
      }
    }

    function resetProdForm() {
      document.getElementById('edit-prod-id').value = '';
      document.getElementById('prod-title').value = '';
      document.getElementById('prod-price').value = '';
      document.getElementById('prod-specs').value = '';
      document.getElementById('prod-desc').value = '';
      document.getElementById('prod-img').value = '';
      document.getElementById('prod-form-title').innerText = "إضافة / تعديل منتج";
    }

    // 🔥 نشر التحديثات فوراً على GitHub علنياً
    async function syncToGitHub() {
      const token = localStorage.getItem('gh_token');
      if (!token) return alert("يرجى إدخال رمز الاتصال أولاً للحفظ المباشر.");

      if (!confirm("سيتم الآن نشر جميع التغييرات مباشرة على المتجر علنياً. هل أنت جاهز؟")) return;

      showStatus("⏳ جاري نشر وتحديث المتجر فورياً...");

      // تحويل البيانات لـ base64 (متطلبات API لـ GitHub)
      const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(storeData, null, 2))));

      try {
        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FILE_PATH}`, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "تحديث مباشر للمتجر عبر لوحة التحكم",
            content: updatedContent,
            sha: fileSHA // الـ SHA الأصلي ضروري جداً
          })
        });

        if (res.ok) {
          const data = await res.json();
          fileSHA = data.content.sha; // تحديث الـ SHA الجديد للحفظ التالي
          showStatus("✅ تم نشر وتحديث المتجر بنجاح! ستظهر التحديثات علنياً الآن للزوار.");
        } else {
          showStatus("❌ فشل التحديث الفوري. تأكد من صحة الرمز ومنح صلاحية 'repo'.");
        }
      } catch (e) {
        showStatus("حدث خطأ في الاتصال بالشبكة.");
      }
    }

    // محاولة جلب البيانات فور فتح الصفحة
    loadFromGitHub();
  </script>
</body>
</html>
